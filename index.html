<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Truna</title>
<meta name="description" content="Truna trains role-specific expert models built to run a business function end to end.">
<style>
:root{
  --ground:#10151B; --panel:#161C24; --ink:#ECEAE3; --muted:#98A0A8; --faint:#5E6871;
  --line:#242C35; --accent:#E08A3C;
  --serif:"Iowan Old Style","Palatino Nova",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next",Avenir,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root{
    --ground:#F2EFE8; --panel:#FFFFFF; --ink:#1C222A; --muted:#5A636D; --faint:#8B939C;
    --line:#DCD7CC; --accent:#C26A1B;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased}
main{max-width:38em;width:100%}
.brand{font-family:var(--mono);font-size:13px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--accent);margin-bottom:34px}
h1{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;line-height:1.08;
  font-size:clamp(34px,7vw,58px);text-wrap:balance}
.lede{margin-top:24px;font-size:clamp(16px,2.2vw,20px);line-height:1.6;color:var(--muted);max-width:32em}
.lede b{color:var(--ink);font-weight:600}
.row{margin-top:44px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline;
  font-family:var(--mono);font-size:13px;letter-spacing:.04em}
.row a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line);
  padding-bottom:2px}
.row a:hover,.row a:focus-visible{border-color:var(--accent);outline:none}
.row span{color:var(--faint)}
footer{margin-top:64px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint)}
</style>
</head>
<body>
<main>
  <p class="brand" style="display:flex;align-items:center"><svg width="30" height="30" viewBox="0 0 30 30" style="margin-right:12px;flex:none"><circle cx="15" cy="15" r="12.5" fill="none" stroke="currentColor" opacity=".55" stroke-width="1.3" stroke-dasharray="3 3.5"/><circle cx="18.5" cy="17.5" r="5" fill="var(--accent)"/></svg><span>Truna</span></p>
  <h1>General models know everything.<br>They're experts at nothing.</h1>
  <p class="lede"><b>We train the experts</b> — role-specific models built to run a
  business function end to end, on synthetic data with measured coverage.</p>
  <div class="row">
    <a href="mailto:hello@truna.ai">hello@truna.ai</a>
    <span>deck &amp; demo on request</span>
  </div>
  <footer>&copy; 2026 Truna &middot; truna.ai</footer>
</main>
</body>
</html>
